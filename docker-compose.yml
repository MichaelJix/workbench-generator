services:
  workbench-generator:
    build: .
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      WORKBENCH_DATABASE: /data/workbench.db
      WORKBENCH_MASTER_KEY: ${WORKBENCH_MASTER_KEY:?set WORKBENCH_MASTER_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3080}
      OAUTH_PROVIDERS_JSON: ${OAUTH_PROVIDERS_JSON:-{}}
    volumes:
      - workbench-data:/data
    restart: unless-stopped
volumes:
  workbench-data:
